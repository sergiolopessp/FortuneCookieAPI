      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres2018!
    ports:
      - "5432:5432"
    volumes:
      - /home/sergiolopes/Documentos/DataBase:/var/lib/postgresql/data
